# 펌웨어 코드를 고쳐서 올리면 자동으로 빌드해서 docs/firmware에 넣고,
# manifest.json 버전을 펌웨어의 FW_VERSION에 맞춰 줘요.
# 원격 업데이트(개발자 모드)용으로 앱 이미지(pcpower-app.bin)와 ota.json(버전·크기·MD5)도 같이 올려요.
# GitHub Pages는 Settings → Pages → "Deploy from a branch" → main / docs 로 설정해요.
name: firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PlatformIO 설치
        run: pip install platformio

      - name: 빌드
        run: pio run -d firmware

      - name: 사이트에 펌웨어 반영
        run: |
          cp firmware/.pio/build/pcpower/firmware.factory.bin docs/firmware/pcpower-factory.bin
          cp firmware/.pio/build/pcpower/firmware.bin docs/firmware/pcpower-app.bin
          VER=$(grep -oP 'FW_VERSION = "\K[^"]+' firmware/PCPowerSwitch/PCPowerSwitch.ino)
          python3 - "$VER" <<'PY'
          import hashlib, json, sys
          ver = sys.argv[1]
          p = "docs/manifest.json"
          m = json.load(open(p, encoding="utf-8"))
          m["version"] = ver
          json.dump(m, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          app = open("docs/firmware/pcpower-app.bin", "rb").read()
          ota = {"version": ver, "file": "pcpower-app.bin", "size": len(app),
                 "md5": hashlib.md5(app).hexdigest()}
          json.dump(ota, open("docs/firmware/ota.json", "w", encoding="utf-8"), indent=2)
          PY
          sed -i "s/<span id=\"pageVer\">v[^<]*</<span id=\"pageVer\">v$VER</" docs/index.html

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/pcpower-factory.bin docs/firmware/pcpower-app.bin docs/firmware/ota.json docs/manifest.json docs/index.html
          git diff --cached --quiet || git commit -m "펌웨어 빌드 반영"
          git push
