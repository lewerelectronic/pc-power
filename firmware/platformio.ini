; PC 원격 전원 v2 — ESP32-C3 (SuperMini, XIAO ESP32C3 등 공용 펌웨어)
[platformio]
src_dir = PCPowerSwitch
default_envs = pcpower

[env:pcpower]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
board_build.flash_mode = dio          ; SuperMini 호환용 (모든 C3 보드에서 동작)
board_build.partitions = huge_app.csv ; 무선 업데이트 없음 → 앱 영역 크게
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
